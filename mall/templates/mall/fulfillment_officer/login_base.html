{% load static %}<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}Fulfillment Officer — {{ site_brand|default:"Honey Cave Market" }}{% endblock %}</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
<style>
:root {
  --gold: #C9A84C;
  --gold-light: #d9b86a;
  --dark: #1A1410;
  --bg: #FAF7F2;
  --surface: #fff;
  --border: #e7e2d8;
  --muted: #6b6055;
  --danger: #c62828;
  --success: #2e7d32;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  font-family: 'Inter', system-ui, -apple-system, sans-serif;
  background: var(--bg);
  color: var(--dark);
  line-height: 1.55;
}
header.skp-bar {
  background: var(--dark);
  color: #fff;
  padding: 1rem 1.5rem;
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 0.75rem;
}
header.skp-bar .brand {
  font-family: 'Playfair Display', serif;
  font-weight: 700;
  font-size: 1.15rem;
  color: var(--gold);
  white-space: nowrap;
}
main { max-width: 1100px; margin: 0 auto; padding: 1.5rem; }
.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 1.25rem 1.5rem;
  margin-bottom: 1.25rem;
}
h1, h2, h3 { font-family: 'Playfair Display', serif; margin: 0 0 0.6rem; }
h1 { font-size: 1.6rem; }
.btn {
  display: inline-block; padding: 0.6rem 1.1rem; border: none;
  border-radius: 8px; font-weight: 600; font-size: 0.88rem;
  text-decoration: none; cursor: pointer; transition: filter 0.15s;
  font-family: inherit;
}
.btn-gold { background: var(--gold); color: var(--dark); }
.btn-gold:hover { filter: brightness(1.05); }
.alert {
  padding: 0.7rem 1rem; border-radius: 8px; margin-bottom: 1rem; font-size: 0.9rem;
}
.alert-error   { background: #fde7e7; color: #721c24; border: 1px solid #f5c6cb; }
.alert-success { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
.alert-info    { background: #d1ecf1; color: #0c5460; border: 1px solid #bee5eb; }
</style>
</head>
<body>
<header class="skp-bar">
  <div class="brand">📦 Fulfillment Officer Portal</div>
</header>
<main>
  {% if messages %}
  {% for m in messages %}
  <div class="alert alert-{{ m.tags|default:'info' }}">{{ m }}</div>
  {% endfor %}
  {% endif %}
  {% block content %}{% endblock %}
</main>
</body>
</html>
